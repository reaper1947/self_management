<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Contribution of each body segment to front-lever torque"><title>Contribution of each body segment to front-lever torque</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><text x="60.0" y="38.0" class="lbl-s" text-anchor="start">FULL FRONT LEVER — WHERE THE TORQUE COMES FROM</text><rect x="41.9" y="60" width="18.1" height="44" fill="#0a0d12" stroke="#646d78" stroke-width="1" stroke-dasharray="3 3"/><line x1="51.0" y1="108.0" x2="51.0" y2="112.0" stroke="#646d78" stroke-width="1"/><text x="51.0" y="128.0" class="lbl" text-anchor="middle">head</text><text x="51.0" y="143.0" class="lbl-a" text-anchor="middle">-4%</text><rect x="60.0" y="60" width="151.1" height="44" fill="#ff9a2e" opacity="0.92"/><rect x="60.0" y="60" width="151.1" height="44" fill="none" stroke="#0a0d12" stroke-width="2"/><line x1="135.6" y1="108.0" x2="135.6" y2="146.0" stroke="#646d78" stroke-width="1"/><text x="135.6" y="162.0" class="lbl" text-anchor="middle">torso</text><text x="135.6" y="177.0" class="lbl-a" text-anchor="middle">33%</text><rect x="211.1" y="60" width="0.0" height="44" fill="#646d78" opacity="0.92"/><rect x="211.1" y="60" width="0.0" height="44" fill="none" stroke="#0a0d12" stroke-width="2"/><line x1="211.1" y1="108.0" x2="211.1" y2="112.0" stroke="#646d78" stroke-width="1"/><text x="211.1" y="128.0" class="lbl" text-anchor="middle">arms</text><text x="211.1" y="143.0" class="lbl-a" text-anchor="middle">0%</text><rect x="211.1" y="60" width="163.7" height="44" fill="#c96f10" opacity="0.92"/><rect x="211.1" y="60" width="163.7" height="44" fill="none" stroke="#0a0d12" stroke-width="2"/><line x1="293.0" y1="108.0" x2="293.0" y2="146.0" stroke="#646d78" stroke-width="1"/><text x="293.0" y="162.0" class="lbl" text-anchor="middle">thighs</text><text x="293.0" y="177.0" class="lbl-a" text-anchor="middle">36%</text><rect x="374.9" y="60" width="163.2" height="44" fill="#c96f10" opacity="0.92"/><rect x="374.9" y="60" width="163.2" height="44" fill="none" stroke="#0a0d12" stroke-width="2"/><line x1="456.5" y1="108.0" x2="456.5" y2="112.0" stroke="#646d78" stroke-width="1"/><text x="456.5" y="128.0" class="lbl" text-anchor="middle">shins + feet</text><text x="456.5" y="143.0" class="lbl-a" text-anchor="middle">35%</text><text x="60.0" y="224.0" class="lbl-s" text-anchor="start">Your torso alone is a third of it, and a tuck cannot remove any of that —</text><text x="60.0" y="238.0" class="lbl-s" text-anchor="start">which is why even a deep tuck still asks for two thirds of the full hold.</text></svg>
