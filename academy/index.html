<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Peter1947 Academy - Login</title>
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='academy.css'>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    
    <div class="container">
        <header class="page-header">
            <a href="/" class="logo">PETER<span>1947</span></a>
            <p class="subtitle">Welcome to Peter1947 Academy</p>
        </header>

        <main class="card-wrapper">
            <div class="glass-card">
                <div class="tabs">
                    <button class="tab-btn active" data-target="login-form">Login</button>
                    <button class="tab-btn" data-target="signup-form">Sign Up</button>
                    <div class="tab-indicator"></div>
                </div>

                <div class="form-container">
                    <div id="message-container" class="message hidden"></div>
                    
                    <div class="form-slider">
                        <!-- Login Form -->
                        <form id="login-form" class="auth-form active">
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="email" id="login-email" placeholder="Email Address" required>
                            </div>
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="login-password" placeholder="Password" required>
                                <button type="button" class="toggle-password" tabindex="-1">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                            <div class="form-footer">
                                <a href="#" class="forgot-link">Forgot password?</a>
                            </div>
                            <button type="submit" class="submit-btn">
                                <span class="btn-text">Login</span>
                                <div class="spinner hidden"></div>
                            </button>
                        </form>

                        <!-- Sign Up Form -->
                        <form id="signup-form" class="auth-form">
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <input type="text" id="signup-name" placeholder="Full Name" required>
                            </div>
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="email" id="signup-email" placeholder="Email Address" required>
                            </div>
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="signup-password" placeholder="Password" required>
                                <button type="button" class="toggle-password" tabindex="-1">
                                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="strength-bar"><div class="strength-fill"></div></div>
                                <span class="strength-text"></span>
                            </div>
                            <div class="input-group">
                                <span class="icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="signup-confirm" placeholder="Confirm Password" required>
                            </div>
                            <button type="submit" class="submit-btn">
                                <span class="btn-text">Create Account</span>
                                <div class="spinner hidden"></div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="social-proof">
                <p>🎓 Join 100+ students mastering Calisthenics & Robotics</p>
            </div>
        </main>
    </div>

    <script src="academy.js"></script>
</body>
</html>
