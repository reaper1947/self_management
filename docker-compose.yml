version: '3.8'

services:
  dashboard:
    build: .
    container_name: self_management_dashboard
    expose:
      - "5055"
    volumes:
      # This maps the database outside the container so data is never lost when rebuilding
      - ./habit-tracker/habit_tracker.db:/app/habit-tracker/habit_tracker.db
      # Uploaded course videos / documents
      - ./media:/app/media
    environment:
      # Inject your passwords and keys here (Do not push real keys to GitHub)
      #
      # No default, on purpose. APP_PASSWORD gates the admin panel and — through
      # nginx auth_request — the web terminal, so a fallback committed to a
      # public repo is a published credential. The ":?" form makes compose
      # refuse to start instead, which is the failure mode you want.
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env — it gates /academy/admin and /terminal/}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - MEDIA_DIR=/app/media
      - BMC_USERNAME=${BMC_USERNAME:-peter1947}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: self_management_proxy
    ports:
      - "5173:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
