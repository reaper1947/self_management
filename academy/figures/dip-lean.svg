<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Upright versus leaning dip"><title>Upright versus leaning dip</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><text x="26.0" y="30.0" class="lbl-s" text-anchor="start">THE LEAN DECIDES WHAT THE DIP TRAINS</text><rect x="154" y="68" width="32" height="7" fill="#646d78"/><polyline points="177.2,220.8 168.1,215.5 171.2,179.7 174.4,143.8 174.4,98.8" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><polyline points="174.4,98.8 166.8,86.0 170.0,74.0" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><circle cx="174.4" cy="82.3" r="6.4" fill="none" stroke="#ece7dd" stroke-width="3" opacity="1.0"/><line x1="170.0" y1="68.0" x2="170.0" y2="232.0" stroke="#646d78" stroke-width="1" stroke-dasharray="3 4"/><g><circle cx="173.2" cy="132.0" r="5" fill="#0a0d12" stroke="#ff9a2e" stroke-width="1.4"/><path d="M173.2 132.0 L173.2 127.0 A5 5 0 0 1 178.2 132.0 Z" fill="#ff9a2e"/><path d="M173.2 132.0 L173.2 137.0 A5 5 0 0 1 168.2 132.0 Z" fill="#ff9a2e"/></g><line x1="170.0" y1="228.0" x2="170.0" y2="236.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="173.2" y1="228.0" x2="173.2" y2="236.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="170.0" y1="232.0" x2="173.2" y2="232.0" stroke="#ff9a2e" stroke-width="1.2"/><text x="170.0" y="258.0" class="big" text-anchor="middle">UPRIGHT</text><text x="170.0" y="278.0" class="lbl" text-anchor="middle">elbows tight, triceps</text><rect x="404" y="68" width="32" height="7" fill="#646d78"/><polyline points="474.2,210.0 465.1,204.8 464.2,168.8 457.3,133.4 433.5,95.3" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><polyline points="433.5,95.3 418.8,86.3 420.0,74.0" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><circle cx="424.8" cy="81.3" r="6.4" fill="none" stroke="#ece7dd" stroke-width="3" opacity="1.0"/><line x1="420.0" y1="68.0" x2="420.0" y2="232.0" stroke="#646d78" stroke-width="1" stroke-dasharray="3 4"/><g><circle cx="447.1" cy="124.9" r="5" fill="#0a0d12" stroke="#ff9a2e" stroke-width="1.4"/><path d="M447.1 124.9 L447.1 119.9 A5 5 0 0 1 452.1 124.9 Z" fill="#ff9a2e"/><path d="M447.1 124.9 L447.1 129.9 A5 5 0 0 1 442.1 124.9 Z" fill="#ff9a2e"/></g><line x1="420.0" y1="228.0" x2="420.0" y2="236.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="447.1" y1="228.0" x2="447.1" y2="236.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="420.0" y1="232.0" x2="447.1" y2="232.0" stroke="#ff9a2e" stroke-width="1.2"/><text x="420.0" y="258.0" class="big" text-anchor="middle">LEANING</text><text x="420.0" y="278.0" class="lbl" text-anchor="middle">chest over the hands</text><text x="26.0" y="278.0" class="lbl-s" text-anchor="start">Upright, d is almost zero — the elbows do the work. Lean, and d opens up under your chest.</text><text x="26.0" y="294.0" class="lbl-s" text-anchor="start">Same movement, two different jobs. Pick one per block and stay with it.</text></svg>
