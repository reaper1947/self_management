<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" role="img" aria-label="How tempo notation works"><title>How tempo notation works</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><text x="36.0" y="34.0" class="lbl-s" text-anchor="start">TEMPO — FOUR NUMBERS, ONE REP</text><rect x="60" y="92" width="120" height="34" fill="none" stroke="#2b3543" stroke-width="1"/><text x="120.0" y="115.0" class="big" text-anchor="middle">3</text><text x="120.0" y="144.0" class="lbl-s" text-anchor="middle">lower</text><rect x="186" y="92" width="40" height="34" fill="none" stroke="#2b3543" stroke-width="1"/><text x="206.0" y="115.0" class="big" text-anchor="middle">1</text><text x="206.0" y="144.0" class="lbl-s" text-anchor="middle">pause</text><rect x="232" y="92" width="60" height="34" fill="none" stroke="#2b3543" stroke-width="1"/><text x="262.0" y="115.0" class="big" text-anchor="middle">1</text><text x="262.0" y="144.0" class="lbl-s" text-anchor="middle">lift</text><rect x="298" y="92" width="30" height="34" fill="none" stroke="#2b3543" stroke-width="1"/><text x="313.0" y="115.0" class="big" text-anchor="middle">0</text><text x="313.0" y="144.0" class="lbl-s" text-anchor="middle">top</text><text x="60.0" y="170.0" class="lbl-a" text-anchor="start">3 · 1 · 1 · 0</text><text x="60.0" y="194.0" class="lbl" text-anchor="start">Three seconds down, one-second pause, one second up, no rest at the top.</text><text x="60.0" y="214.0" class="lbl-s" text-anchor="start">Written like this, "go slower" becomes a number you can actually repeat.</text></svg>
