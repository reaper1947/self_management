1"/><line x1="186.0" y1="53.0" x2="191.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="195.0" y1="53.0" x2="200.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="204.0" y1="53.0" x2="209.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="213.0" y1="53.0" x2="218.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="222.0" y1="53.0" x2="227.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="231.0" y1="53.0" x2="236.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="240.0" y1="53.0" x2="245.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="249.0" y1="53.0" x2="254.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="258.0" y1="53.0" x2="263.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="267.0" y1="53.0" x2="272.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="276.0" y1="53.0" x2="281.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="285.0" y1="53.0" x2="290.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="294.0" y1="53.0" x2="299.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="303.0" y1="53.0" x2="308.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="312.0" y1="53.0" x2="317.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="321.0" y1="53.0" x2="326.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="330.0" y1="53.0" x2="335.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="339.0" y1="53.0" x2="344.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="348.0" y1="53.0" x2="353.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="357.0" y1="53.0" x2="362.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="366.0" y1="53.0" x2="371.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="375.0" y1="53.0" x2="380.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="384.0" y1="53.0" x2="389.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="393.0" y1="53.0" x2="398.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="402.0" y1="53.0" x2="407.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="411.0" y1="53.0" x2="416.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="420.0" y1="53.0" x2="425.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="429.0" y1="53.0" x2="434.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="438.0" y1="53.0" x2="443.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="447.0" y1="53.0" x2="452.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="456.0" y1="53.0" x2="461.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="465.0" y1="53.0" x2="470.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="474.0" y1="53.0" x2="479.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="483.0" y1="53.0" x2="488.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="492.0" y1="53.0" x2="497.0" y2="58.0" stroke="#646d78" stroke-width="1"/><line x1="60.0" y1="58.0" x2="500.0" y2="58.0" stroke="#646d78" stroke-width="1.6"/><path d="M280 238 L280 76" fill="none" stroke="#646d78" stroke-width="2" stroke-dasharray="5 5"/><text x="290.0" y="150.0" class="lbl-s" text-anchor="start">straight up</text><text x="290.0" y="164.0" class="lbl-s" text-anchor="start">→ you hit the bar</text><path d="M280 238 C206 196 206 100 274 72" fill="none" stroke="#ff9a2e" stroke-width="2.4" marker-end="url(#a)"/><text x="70.0" y="120.0" class="lbl-a" text-anchor="start">THE PATH IS A C, NOT A LINE</text><text x="70.0" y="142.0" class="lbl" text-anchor="start">Pull the bar to your ribs, not</text><text x="70.0" y="160.0" class="lbl" text-anchor="start">your chin to the bar. The chest</text><text x="70.0" y="178.0" class="lbl" text-anchor="start">arrives over the bar, then the</text><text x="70.0" y="196.0" class="lbl" text-anchor="start">elbows rotate through.</text><circle cx="280.0" cy="60.0" r="4" fill="#ece7dd"/><circle cx="280.0" cy="60.0" r="7.5" fill="none" stroke="#646d78" stroke-width="1"/><text x="60.0" y="268.0" class="lbl-s" text-anchor="start">A muscle-up is not a big pull-up. It is a pull-up that changes direction at the top.</text><text x="60.0" y="286.0" class="lbl-s" text-anchor="start">If your pull stops at the sternum you do not need more power — you need a different arc.</text></svg>
