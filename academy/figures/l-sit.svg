<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Torque about the hands in an L-sit"><title>Torque about the hands in an L-sit</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><polyline points="250.4,142.7 243.6,154.5 196.8,154.5 150.0,154.5 150.0,96.0" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><polyline points="150.0,96.0 150.0,127.2 150.0,156.4" fill="none" stroke="#ece7dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><circle cx="150.0" cy="74.5" r="6.4" fill="none" stroke="#ece7dd" stroke-width="3" opacity="1.0"/><line x1="120.0" y1="156.4" x2="180.0" y2="156.4" stroke="#646d78" stroke-width="2.4"/><circle cx="150.0" cy="156.4" r="3" fill="#ece7dd"/><circle cx="150.0" cy="156.4" r="6.5" fill="none" stroke="#646d78" stroke-width="1"/><line x1="150.0" y1="156.4" x2="150.0" y2="236.0" stroke="#646d78" stroke-width="1" stroke-dasharray="3 4"/><g><circle cx="163.1" cy="130.5" r="5.5" fill="#0a0d12" stroke="#ff9a2e" stroke-width="1.4"/><path d="M163.1 130.5 L163.1 125.0 A5.5 5.5 0 0 1 168.6 130.5 Z" fill="#ff9a2e"/><path d="M163.1 130.5 L163.1 136.0 A5.5 5.5 0 0 1 157.6 130.5 Z" fill="#ff9a2e"/></g><line x1="163.1" y1="130.5" x2="163.1" y2="190.5" stroke="#ff9a2e" stroke-width="1.6" marker-end="url(#a)"/><text x="173.1" y="186.5" class="lbl-a" text-anchor="start">m·g</text><line x1="150.0" y1="226.0" x2="150.0" y2="234.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="163.1" y1="226.0" x2="163.1" y2="234.0" stroke="#ff9a2e" stroke-width="1.2"/><line x1="150.0" y1="230.0" x2="163.1" y2="230.0" stroke="#ff9a2e" stroke-width="1.2"/><rect x="134.6" y="222.0" width="44" height="15" fill="#0a0d12"/><text x="156.6" y="234.0" class="lbl-a" text-anchor="middle">d</text><text x="360.0" y="96.0" class="lbl" text-anchor="start">Straighten the knees and d grows.</text><text x="360.0" y="116.0" class="lbl" text-anchor="start">Nothing about you changed —</text><text x="360.0" y="136.0" class="lbl" text-anchor="start">the lever did.</text><text x="360.0" y="172.0" class="lbl-a" text-anchor="start">tuck → one leg → L-sit</text><text x="360.0" y="192.0" class="lbl" text-anchor="start">is one ladder, not three</text><text x="360.0" y="212.0" class="lbl" text-anchor="start">separate skills.</text><text x="26.0" y="276.0" class="lbl-s" text-anchor="start">Push the floor away and stay tall: a sunk shoulder shortens nothing and costs everything.</text></svg>
