<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-label="Relative force capacity of eccentric, isometric and concentric contraction"><title>Relative force capacity of eccentric, isometric and concentric contraction</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><text x="36.0" y="34.0" class="lbl-s" text-anchor="start">HOW MUCH FORCE A MUSCLE CAN MAKE</text><text x="188.0" y="78.0" class="lbl" text-anchor="end">lowering (eccentric)</text><rect x="200" y="63" width="210.0" height="20" fill="#ff9a2e" opacity="0.9"/><text x="418.0" y="78.0" class="lbl-a" text-anchor="start">1.30×</text><text x="188.0" y="118.0" class="lbl" text-anchor="end">holding (isometric)</text><rect x="200" y="103" width="161.5" height="20" fill="#646d78" opacity="0.9"/><text x="369.5" y="118.0" class="lbl-a" text-anchor="start">1.00×</text><text x="188.0" y="158.0" class="lbl" text-anchor="end">lifting (concentric)</text><rect x="200" y="143" width="137.3" height="20" fill="#646d78" opacity="0.9"/><text x="345.3" y="158.0" class="lbl-a" text-anchor="start">0.85×</text><text x="36.0" y="208.0" class="lbl-s" text-anchor="start">You can lower a weight you cannot lift. That gap is the</text><text x="36.0" y="224.0" class="lbl-s" text-anchor="start">entire reason negatives build a first pull-up.</text></svg>
