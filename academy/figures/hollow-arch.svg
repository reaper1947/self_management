<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-label="Hollow body versus arch"><title>Hollow body versus arch</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a2e"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#646d78"/></marker></defs><style>.lbl{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#9aa3ad}.lbl-a{font:500 11px "JetBrains Mono",ui-monospace,monospace;fill:#ff9a2e}.lbl-s{font:400 9.5px "JetBrains Mono",ui-monospace,monospace;fill:#646d78;letter-spacing:.08em}.big{font:700 13px "JetBrains Mono",ui-monospace,monospace;fill:#ece7dd}</style><text x="40.0" y="34.0" class="lbl-s" text-anchor="start">THE TWO SHAPES EVERYTHING IS BUILT FROM</text><path d="M60 110 Q135.0 76 210 110" fill="none" stroke="#ece7dd" stroke-width="3.2" stroke-linecap="round"/><circle cx="52" cy="98" r="9.600000000000001" fill="none" stroke="#ece7dd" stroke-width="3.2"/><line x1="60.0" y1="130.0" x2="210.0" y2="130.0" stroke="#2b3543" stroke-width="1" stroke-dasharray="3 4"/><line x1="135.0" y1="130.0" x2="135.0" y2="100.0" stroke="#ff9a2e" stroke-width="1.5" marker-end="url(#a)"/><text x="142.0" y="118.0" class="lbl-a" text-anchor="start">ribs down, pelvis tucked</text><text x="40.0" y="168.0" class="big" text-anchor="start">HOLLOW</text><text x="40.0" y="188.0" class="lbl" text-anchor="start">lower back flat against the floor.</text><text x="40.0" y="204.0" class="lbl" text-anchor="start">This is the shape of every straight-arm</text><text x="40.0" y="220.0" class="lbl" text-anchor="start">hold you will ever do.</text><path d="M320 110 Q395.0 144 470 110" fill="none" stroke="#ece7dd" stroke-width="3.2" stroke-linecap="round"/><circle cx="312" cy="122" r="9.600000000000001" fill="none" stroke="#ece7dd" stroke-width="3.2"/><line x1="320.0" y1="130.0" x2="470.0" y2="130.0" stroke="#2b3543" stroke-width="1" stroke-dasharray="3 4"/><text x="40.0" y="240.0" class="lbl-s" text-anchor="start">A lever held in an arch leaks force at the hips — the shape is the strength.</text><text x="320.0" y="168.0" class="big" text-anchor="start">ARCH</text><text x="320.0" y="188.0" class="lbl" text-anchor="start">the shape a tired lever collapses into.</text><text x="320.0" y="204.0" class="lbl" text-anchor="start">Train it deliberately (superman holds),</text><text x="320.0" y="220.0" class="lbl" text-anchor="start">never accept it in a lever.</text></svg>
