<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site mark is the graph: one lit node with its edges. Kept to three
       edges and one filled dot so it still reads at 16px in a browser tab. -->
  <rect width="32" height="32" fill="#0a0d12"/>
  <g stroke="#c96f10" stroke-width="1.6" stroke-linecap="round">
    <path d="M16 16 L7 8"/>
    <path d="M16 16 L26 11"/>
    <path d="M16 16 L12 26"/>
  </g>
  <circle cx="7"  cy="8"  r="2.1" fill="#646d78"/>
  <circle cx="26" cy="11" r="2.1" fill="#646d78"/>
  <circle cx="12" cy="26" r="2.1" fill="#646d78"/>
  <circle cx="16" cy="16" r="5.2" fill="#ff9a2e"/>
</svg>
